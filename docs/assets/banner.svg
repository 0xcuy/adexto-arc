<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">ADEXTO on Arc</title>
  <desc id="d">Markets for AI agents. Gas paid in USDC, no deposit, no admin key.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06070F"/>
      <stop offset="0.55" stop-color="#121A4A"/>
      <stop offset="1" stop-color="#3B1238"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#4B5BD6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4B5BD6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="1" r="0.5">
      <stop offset="0" stop-color="#942753" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#942753" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7C8CFF"/>
      <stop offset="1" stop-color="#F0A6CF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="frame">
      <rect width="1280" height="400" rx="28"/>
    </clipPath>
    <mask id="adx-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <g transform="rotate(-14 256 286)"><path d="M76,286 a180,66 0 1 0 360,0 a180,66 0 1 0 -360,0 Z M99,276 a169,55 0 1 0 338,0 a169,55 0 1 0 -338,0 Z" fill="none" stroke="#000" stroke-width="20" stroke-linejoin="round"/></g>
      <circle cx="388" cy="302" r="34" fill="none" stroke="#000" stroke-width="20"/>
    </mask>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="400" fill="url(#glowA)"/>
    <rect width="1280" height="400" fill="url(#glowB)"/>

    <!-- ADEXTO mark -->
    <svg x="72" y="78" width="96" height="96" viewBox="74 77 364 364">
      <g fill="#FFFFFF">
        <path d="M256,104 L438,414 L350,414 L256,214 L162,414 L74,414 Z" mask="url(#adx-cut)"/>
        <g transform="rotate(-14 256 286)"><path d="M76,286 a180,66 0 1 0 360,0 a180,66 0 1 0 -360,0 Z M99,276 a169,55 0 1 0 338,0 a169,55 0 1 0 -338,0 Z" fill-rule="evenodd"/></g>
        <circle cx="388" cy="302" r="34"/>
      </g>
    </svg>

    <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="190" y="150" font-size="68" font-weight="800" letter-spacing="3" fill="#FFFFFF">ADEXTO</text>

      <!-- Arc mark (@web3icons/core 4.0.55, monochrome on the dark ground), then the chain name -->
      <svg x="192" y="171" width="30" height="30" viewBox="0 0 24 24">
        <path fill="#C7CCFF" d="M3.5 20.999c.146-4.407.893-8.519 2.142-11.717C7.223 5.231 9.513 3 12.088 3s4.865 2.231 6.447 6.283c.822 2.107 1.427 4.61 1.786 7.334q.048.366.087.737.015.024.013.041s.21 1.317.256 3.604h-.024c-.313-.256-4-3.153-10.112-2.314.093-1.035.22-2.04.383-3.005l.027-.146a24.5 24.5 0 0 1 6.104.57q-.007-.056-.017-.115c-.33-2.06-.819-3.945-1.448-5.556-1.029-2.635-2.371-4.271-3.502-4.271-1.132 0-2.474 1.636-3.503 4.271q-.375.958-.679 2.034a30 30 0 0 0-.718 3.213A40 40 0 0 0 6.662 21H3.5z"/>
      </svg>
      <text x="232" y="196" font-size="34" font-weight="600" fill="#C7CCFF">on Arc</text>

      <text x="72" y="262" font-size="32" font-weight="700" fill="#FFFFFF">Markets for AI agents</text>
      <text x="72" y="298" font-size="19" font-weight="500" fill="#D5D8FA">Gas paid in USDC · no deposit · no admin key</text>

      <!-- chips -->
      <g font-size="15" font-weight="600" fill="#E8EAFE">
        <rect x="72" y="326" width="168" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#9AA6FF" stroke-opacity="0.45"/>
        <text x="156" y="348" text-anchor="middle">ERC-8004 identity</text>
        <rect x="252" y="326" width="140" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#9AA6FF" stroke-opacity="0.45"/>
        <text x="322" y="348" text-anchor="middle">MCP · 14 tools</text>
        <rect x="404" y="326" width="130" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#9AA6FF" stroke-opacity="0.45"/>
        <text x="469" y="348" text-anchor="middle">A2A + x402</text>
        <rect x="546" y="326" width="190" height="34" rx="17" fill="#16A34A" fill-opacity="0.22" stroke="#4ADE80" stroke-opacity="0.6"/>
        <text x="641" y="348" text-anchor="middle">Sourcify exact match</text>
      </g>
    </g>

    <!-- bonding curve panel -->
    <g>
      <rect x="812" y="60" width="400" height="280" rx="20" fill="#FFFFFF" fill-opacity="0.045" stroke="#7C8CFF" stroke-opacity="0.4"/>
      <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
        <text x="840" y="96" font-size="15" font-weight="600" fill="#C7CCFF">bonding curve · price in USDC</text>
        <text x="1188" y="324" font-size="13" font-weight="500" fill="#C7CCFF" fill-opacity="0.8" text-anchor="end">supply sold →</text>
      </g>
      <path d="M842 300 H1188 M842 300 V112" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" fill="none"/>
      <path d="M846 296 Q1010 292 1184 268" stroke="#4ADE80" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
      <text x="1184" y="258" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#86EFAC" text-anchor="end">floor only rises</text>
      <path d="M846 294 C 970 290, 1080 246, 1182 120" stroke="url(#curve)" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.35" filter="url(#soft)"/>
      <path d="M846 294 C 970 290, 1080 246, 1182 120" stroke="url(#curve)" stroke-width="4" stroke-linecap="round" fill="none"/>
      <g fill="#FFFFFF">
        <circle cx="900" cy="290" r="5"/>
        <circle cx="972" cy="282" r="5"/>
        <circle cx="1040" cy="262" r="5"/>
        <circle cx="1098" cy="226" r="5"/>
        <circle cx="1146" cy="174" r="6"/>
      </g>
      <g fill="#F0A6CF" opacity="0.5" filter="url(#soft)">
        <circle cx="1146" cy="174" r="12"/>
      </g>
    </g>
  </g>
</svg>
